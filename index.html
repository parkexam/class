<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#273e50"><title>우리 반 성장 마을 · 체험판</title><style>
*{box-sizing:border-box}body{margin:0;background:#152b39;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none;image-rendering:pixelated}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}.panel{background:linear-gradient(140deg,#2b4356ed,#172e40ee);border:2px solid #b99b65;border-radius:13px;padding:9px 12px;box-shadow:0 4px 0 #102431aa,0 8px 25px #0005;pointer-events:auto}.brand{font-size:17px;font-weight:900;color:#ffe3a0}.sub{font-size:10px;color:#c4d6d9}.stats{font-size:12px;line-height:1.65;min-width:170px}.bar{height:8px;background:#112634;border:1px solid #758fa2;border-radius:9px;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#68cdd0,#f9e38b);width:0%}.buttons{margin-left:auto;display:flex;gap:5px;pointer-events:auto}.btn{background:#f6d18e;color:#543b2d;border:2px solid #fff0b7;border-bottom:4px solid #a16d43;border-radius:11px;padding:9px 11px;font-weight:900;cursor:pointer;font-size:12px}.btn:active{transform:translateY(2px)}#bottom{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.hint{max-width:420px;font-size:12px;line-height:1.5;background:#213d50e8;border:1px solid #a7c6c9;padding:9px 12px;border-radius:12px;pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:4px;pointer-events:auto;touch-action:none}.pad button{background:#f8e2a4df;color:#5e4731;border:2px solid #fff4ca;border-radius:12px;font-size:22px;font-weight:900;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}#modalWrap{position:absolute;inset:0;background:#061521b0;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}#modal{width:min(420px,100%);background:#fdf1d4;color:#4a392a;border:5px solid #a77b4d;border-radius:22px;padding:20px;box-shadow:0 15px 0 #0005}#modal h2{margin:0 0 10px}#modal p{line-height:1.6}#modal .btn{margin:5px 5px 0 0}.muted{font-size:12px;color:#806b56}#toast{position:absolute;top:112px;left:50%;transform:translateX(-50%);background:#fff5d7;color:#49392a;padding:10px 18px;border:2px solid #bd995b;border-radius:16px;font-weight:900;display:none;z-index:9;white-space:nowrap}@media(max-width:650px){#hud{top:6px;left:6px;right:6px;gap:5px}.panel{padding:6px 8px;border-radius:9px}.brand{font-size:12px}.sub{font-size:9px}.stats{font-size:10px;min-width:130px}.btn{padding:7px;font-size:10px}.buttons{width:100%;margin-left:0}.hint{font-size:10px;max-width:190px}.pad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="panel"><div class="brand">🌸 우리 반 성장 마을</div><div class="sub">28명이 함께 자라는 마을 · 로그인 없는 체험판</div></div><div class="panel stats"><b id="stage">Lv.1 · 아기</b><div id="xpLabel">0 / 50 XP</div><div class="bar"><i id="xpBar"></i></div><span id="town">🏡 마을 Lv.1</span></div><div class="buttons"><button class="btn" id="mission">🎯 미션</button><button class="btn" id="grow">✨ 성장 체험</button><button class="btn" id="reset">↺ 초기화</button></div></div><div id="toast"></div><div id="bottom"><div class="hint">🎮 <b>방향키 / WASD / 터치 버튼</b>으로 이동<br>🏠 건물 가까이 가서 누르거나 직접 클릭<br>✨ 성장 체험으로 캐릭터 외관 변화를 확인해 봐!</div><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div></div><div id="modalWrap"><div id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalActions"></div><p class="muted">체험판의 모든 정보는 이 브라우저에서만 유지됩니다.</p></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=1;const world={w:1500,h:1050};let cam={x:0,y:0};let xp=0,level=1,missions=0,selected=null,near=null;const stages=[{min:1,name:'아기',scale:.57,shirt:'#f7b8c9',hair:'#735442'},{min:5,name:'어린이',scale:.76,shirt:'#ffd26e',hair:'#735442'},{min:10,name:'초등학생',scale:.94,shirt:'#6db8f3',hair:'#735442'},{min:20,name:'중학생',scale:1.12,shirt:'#4964ac',hair:'#735442'},{min:35,name:'고등학생',scale:1.22,shirt:'#8c64b9',hair:'#735442'},{min:50,name:'성인',scale:1.32,shirt:'#e6a764',hair:'#735442'}];const stageOf=l=>[...stages].reverse().find(s=>l>=s.min);const nextXP=l=>50+Math.floor(l*16);const buildings=[{id:'library',name:'📚 도서관',x:210,y:235,w:215,h:174,wall:'#f8dcae',roof:'#658bc2',desc:'오늘의 공부 기록을 남기는 공간이야.'},{id:'hall',name:'🏫 마을회관',x:650,y:175,w:235,h:200,wall:'#f6d4b2',roof:'#ca777d',desc:'우리 반 공동 성장 현황을 확인하는 공간이야.'},{id:'lab',name:'🔬 과학 연구소',x:1095,y:250,w:210,h:180,wall:'#b9d5e7',roof:'#698ec6',desc:'과학 퀴즈와 실험 미션을 하는 곳이야.'},{id:'shop',name:'🎁 보상 상점',x:175,y:720,w:195,h:160,wall:'#ffe4b8',roof:'#d68c9f',desc:'캐릭터를 꾸밀 수 있는 보상 상점이야.'},{id:'board',name:'📋 미션 게시판',x:1160,y:735,w:155,h:125,wall:'#e7bd82',roof:'#946e45',desc:'오늘의 공동 미션을 확인해 봐.'}];let player={x:750,y:620,dir:1,step:0};const npcs=Array.from({length:27},(_,i)=>({id:i+2,x:170+(i*127)%1150,y:435+(i*83)%490,tx:0,ty:0,t:0,level:1+(i*7)%43,shirt:['#d57f9d','#72b5d4','#a49ad7','#e7b25e','#72bc94'][i%5],hair:['#473a35','#7a4e35','#2c343f','#ae7545'][i%4]}));const flowers=Array.from({length:240},(_,i)=>({x:(i*73+29)%1490,y:(i*131+31)%1040,c:['#ffe6e9','#fff0a5','#f4a5c7','#a5dbe4'][i%4]}));const trees=[{x:75,y:140},{x:490,y:180},{x:995,y:130},{x:1420,y:180},{x:70,y:570},{x:450,y:820},{x:1000,y:875},{x:1410,y:610},{x:530,y:470},{x:1000,y:465},{x:560,y:960},{x:1330,y:950}];const pond={x:1190,y:570,rx:205,ry:105};function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false}window.addEventListener('resize',resize);resize();function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function text(t,x,y,size=14,color='#fff',align='center'){ctx.textAlign=align;ctx.font=`900 ${size}px system-ui`;ctx.lineWidth=3;ctx.strokeStyle='#493b34';ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y)}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function roof(x,y,w,color){ctx.fillStyle='#684c45';ctx.beginPath();ctx.moveTo(x-14,y+5);ctx.lineTo(x+w/2,y-69);ctx.lineTo(x+w+14,y+5);ctx.closePath();ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-9,y);ctx.lineTo(x+w/2,y-62);ctx.lineTo(x+w+9,y);ctx.closePath();ctx.fill();for(let k=0;k<7;k++)rect(x+10+k*w/8,y-4+(Math.abs(k-3)*10),w/10,4,'#ffffff33')}
function drawBuilding(b){let {x,y,w,h}=b;ellipse(x+w/2,y+h+10,w*.6,20,'#344e4350');rect(x,y,w,h,b.wall);rect(x+8,y+10,w-16,10,'#fff6df');roof(x,y,w,b.roof);for(let i=0;i<2;i++){let wx=x+28+i*(w-85);rect(wx,y+40,40,52,'#735a54');rect(wx+5,y+5+40,30,42,'#93d3ed');rect(wx+18,y+45,4,42,'#f9e9c6');rect(wx+5,y+65,30,4,'#f9e9c6')}rect(x+w/2-23,y+h-70,46,70,'#795749');rect(x+w/2-17,y+h-64,34,64,'#b58565');ellipse(x+w/2+10,y+h-35,3,3,'#fbe0a0');roundRect(x+w/2-74,y+6,148,33,8,'#765342');roundRect(x+w/2-70,y+9,140,27,6,'#a47754');text(b.name,x+w/2,y+29,16,'#fff5ce');for(let i=0;i<5;i++){ellipse(x+i*45-5,y+h+7,12,7,'#e8b4c6');ellipse(x+i*45+2,y+h+5,5,5,'#fff3a8')}}function drawTree(t,i){ellipse(t.x,t.y+39,47,16,'#274c3977');rect(t.x-9,t.y-15,18,59,'#8c6445');for(let j=0;j<6;j++){let a=j*Math.PI/3;ellipse(t.x+Math.cos(a)*22,t.y-27+Math.sin(a)*17,31,27,i%3===0?'#eaa5c5':'#5fa67a');ellipse(t.x+Math.cos(a)*22+5,t.y-34+Math.sin(a)*17,16,15,i%3===0?'#ffd3e7':'#80c58b')}for(let j=0;j<6;j++)ellipse(t.x+(j*17)%50-25,t.y-55+(j*13)%38,3,3,'#fff5ce')}
function character(x,y,l,shirt,hair,id,isPlayer=false,phase=0){let s=stageOf(l),sc=s.scale;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ellipse(0,1,20,7,'#2a4b4c88');let walk=Math.sin(phase)*4;rect(-12,-17,9,19+walk,'#493e5c');rect(4,-17,9,19-walk,'#493e5c');rect(-14,-36,28,27,isPlayer?s.shirt:shirt);rect(-19,-34,7,17,'#f5cda8');rect(12,-34,7,17,'#f5cda8');rect(-18,-69,36,36,'#f7d3b3');rect(-19,-73,38,15,isPlayer?s.hair:hair);rect(-19,-65,8,18,isPlayer?s.hair:hair);rect(11,-65,8,18,isPlayer?s.hair:hair);rect(-10,-52,4,5,'#413e45');rect(7,-52,4,5,'#413e45');rect(-4,-44,8,3,'#d68d8d');if(l>=10){rect(12,-36,10,22,'#c49b6b');rect(15,-34,6,18,'#ead39a')}if(l>=20){rect(-14,-37,28,4,'#f8f0df');rect(-3,-35,6,13,'#d94c59')}if(l>=35){rect(-15,-77,30,5,'#eac86b')}if(l>=50){rect(-18,-37,36,6,'#f8de9b');rect(17,-35,5,20,'#f8de9b')}if(l<5){rect(-15,-22,30,15,'#fff2b9')}ctx.restore();if(isPlayer){ellipse(x,y-91*sc,16,11,'#fce09b');text('★',x,y-86*sc,16,'#fffcdb')}roundRect(x-26,y+6,52,20,7,isPlayer?'#ad6c7d':'#394c60');text(isPlayer?'나':`${id}번`,x,y+20,12,'#fff9df')}
function drawWorld(){rect(0,0,world.w,world.h,'#b5dba4');for(let i=0;i<70;i++){let x=(i*233)%world.w,y=(i*147)%world.h;ellipse(x,y,90,40,i%2?'#b0d69c':'#a8d198')}ctx.strokeStyle='#e9d7b7';ctx.lineWidth=86;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(50,545);ctx.bezierCurveTo(460,490,990,540,1450,525);ctx.moveTo(740,100);ctx.lineTo(740,980);ctx.moveTo(230,780);ctx.bezierCurveTo(550,720,900,760,1240,790);ctx.stroke();ctx.strokeStyle='#f9ead0';ctx.lineWidth=65;ctx.stroke();ellipse(pond.x,pond.y,pond.rx+13,pond.ry+13,'#e7d3a9');ellipse(pond.x,pond.y,pond.rx,pond.ry,'#78c4d4');for(let i=0;i<10;i++)ellipse(1070+i*26,580+Math.sin(i)*25,13,3,'#c4edf1');for(const f of flowers){ellipse(f.x,f.y,4,3,f.c);ellipse(f.x+3,f.y+2,2,2,'#f3cf70')}for(let i=0;i<8;i++){let x=70+i*195;rect(x,975,95,9,'#8eac72');ellipse(x+25,977,13,8,'#8bbd76')}for(let i=0;i<buildings.length;i++)drawBuilding(buildings[i]);for(let i=0;i<trees.length;i++)drawTree(trees[i],i);ellipse(745,555,105,54,'#d7c5a5');ellipse(745,545,85,43,'#8ebba0');ellipse(745,540,60,32,'#d2c8a9');ellipse(745,536,43,25,'#8cd1e3');ellipse(745,526,20,15,'#dff9f5');text('✨ 마을 광장 ✨',745,630,20,'#fff5ce');}
function ui(){let s=stageOf(level),need=nextXP(level);document.getElementById('stage').textContent=`Lv.${level} · ${s.name}`;document.getElementById('xpLabel').textContent=`${xp} / ${need} XP`;document.getElementById('xpBar').style.width=Math.min(100,xp/need*100)+'%';document.getElementById('town').textContent=`🏡 마을 Lv.${1+Math.floor(missions/3)} · 공동 미션 ${missions}회`;}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2200)}function gain(n){xp+=n;let leveled=false;while(xp>=nextXP(level)&&level<60){xp-=nextXP(level);level++;leveled=true}if(leveled)toast(`✨ 레벨 ${level}! ${stageOf(level).name} 단계!`);else toast(`🌟 +${n} XP 획득!`);ui()}
function modal(title,body,actions){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=body;let e=document.getElementById('modalActions');e.innerHTML='';actions.forEach(a=>{let b=document.createElement('button');b.className='btn';b.textContent=a.label;b.onclick=()=>{closeModal();a.action?.()};e.append(b)});document.getElementById('modalWrap').style.display='flex'}function closeModal(){document.getElementById('modalWrap').style.display='none'}document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});function buildingAction(b){modal(b.name,b.desc,[{label:'체험하기 (+30 XP)',action:()=>{missions++;gain(30)}},{label:'닫기'}])}document.getElementById('mission').onclick=()=>modal('🎯 오늘의 공동 미션','과학 복습, 친구 칭찬, 학급 정리 등 공동 미션을 수행하면 개인 XP와 마을 성장도가 올라가!',[{label:'미션 완료 (+80 XP)',action:()=>{missions++;gain(80)}},{label:'닫기'}]);document.getElementById('grow').onclick=()=>{let old=stageOf(level).name;let next=stages.find(s=>s.min>level);if(next){level=next.min;xp=0;ui();toast(`🎉 ${old} → ${next.name} 성장!`)}else toast('👑 최고 성장 단계에 도달했어!')};document.getElementById('reset').onclick=()=>{level=1;xp=0;missions=0;player.x=750;player.y=620;ui();toast('처음부터 다시 시작!')};let keys=new Set();const mapKey=k=>({arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'})[k.toLowerCase()];window.addEventListener('keydown',e=>{let k=mapKey(e.key);if(k){keys.add(k);e.preventDefault()}if(e.key==='Escape')closeModal();if(e.key===' '&&near){buildingAction(near);e.preventDefault()}});window.addEventListener('keyup',e=>{let k=mapKey(e.key);if(k)keys.delete(k)});document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});b.addEventListener('pointerup',()=>keys.delete(k));b.addEventListener('pointercancel',()=>keys.delete(k));b.addEventListener('lostpointercapture',()=>keys.delete(k))});canvas.addEventListener('click',e=>{let x=e.clientX+cam.x,y=e.clientY+cam.y;let b=buildings.find(b=>x>=b.x-20&&x<=b.x+b.w+20&&y>=b.y-70&&y<=b.y+b.h+25);if(b)buildingAction(b)});function tick(t){let dt=Math.min(.05,(t-(tick.last||t))/1000);tick.last=t;if(document.getElementById('modalWrap').style.display!=='flex'){let dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dy=(keys.has('down')?1:0)-(keys.has('up')?1:0);if(dx||dy){let z=Math.hypot(dx,dy);player.x=Math.max(25,Math.min(world.w-25,player.x+dx/z*195*dt));player.y=Math.max(380,Math.min(world.h-25,player.y+dy/z*195*dt));player.step+=dt*13}for(const n of npcs){n.t-=dt;if(n.t<=0){n.tx=n.x+(Math.random()-.5)*260;n.ty=n.y+(Math.random()-.5)*180;n.t=2+Math.random()*5}let vx=n.tx-n.x,vy=n.ty-n.y,d=Math.hypot(vx,vy);if(d>4){n.x=Math.max(25,Math.min(1475,n.x+vx/d*24*dt));n.y=Math.max(405,Math.min(1010,n.y+vy/d*24*dt))}}}cam.x=Math.max(0,Math.min(world.w-W,player.x-W*.5));cam.y=Math.max(0,Math.min(world.h-H,player.y-H*.58));if(W>=world.w)cam.x=(world.w-W)/2;if(H>=world.h)cam.y=(world.h-H)/2;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);drawWorld();const people=[...npcs.map(n=>({x:n.x,y:n.y,l:n.level,shirt:n.shirt,hair:n.hair,id:n.id,phase:t/400+n.id})),{x:player.x,y:player.y,l:level,shirt:'#f6b9c6',hair:'#735442',id:1,isPlayer:true,phase:player.step}];people.sort((a,b)=>a.y-b.y);for(let p of people)character(p.x,p.y,p.l,p.shirt,p.hair,p.id,p.isPlayer,p.phase);near=buildings.find(b=>Math.hypot(player.x-(b.x+b.w/2),player.y-(b.y+b.h+35))<155);if(near){roundRect(player.x-82,player.y-128,164,28,10,'#2b4358');text(`스페이스: ${near.name}`,player.x,player.y-109,12,'#fff1bd')}ctx.restore();requestAnimationFrame(tick)}ui();requestAnimationFrame(tick);
</script></body></html>
