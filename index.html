if(id==='checkin'){openModal('📅 오늘의 출석',`<p class="desc">학생이 직접 오늘의 출석 확인을 누르는 기능이야. 실제 출결부를 대체하는 기능은 아니야.</p><div class="choice">🌷 ${formatDay()} <span class="badge">${state.checked?'체험 완료':'미참여'}</span></div><button class="primary wide" id="checkBtn" ${state.checked?'disabled':''}>${state.checked?'오늘의 출석 확인 완료':'오늘 출석 체험 (+30 XP)'}</button>`,el=>el.querySelector('#checkBtn').onclick=()=>{if(state.checked)return;state.checked=true;state.coins+=10;addXP(30);openPanel('checkin')});return}
if(id==='praise'){openModal('💗 친구 칭찬하기',`<p class="desc">친구에게 따뜻한 칭찬을 남겨 봐. 실제 서비스에서는 교사 승인 후 게시돼. 이 체험판에서는 내 브라우저에만 저장돼.</p><label>칭찬할 친구</label><select id="praiseTo" class="field">${Array.from({length:28},(_,i)=>i+1).filter(n=>n!==state.chosen).map(n=>`<option value="${n}">${n}번 학생</option>`).join('')}</select><label>칭찬 메시지</label><textarea class="field" id="praiseText" rows="3" maxlength="160" placeholder="예: 과학 문제를 친절하게 설명해 줘서 고마워!"></textarea><div style="margin-top:10px"><button class="primary wide" id="praiseSend">칭찬 보내기 (+50 XP, 첫 1회)</button></div><p class="desc">내가 남긴 칭찬</p><div class="scrollList">${state.praise.slice(-5).reverse().map(s=>`<div class="choice"><span>${s.to}번 학생에게<br><small>${escapeText(s.text)}</small></span></div>`).join('')||'<p class="footnote">아직 남긴 칭찬이 없어.</p>'}</div>`,el=>el.querySelector('#praiseSend').onclick=()=>{let str=el.querySelector('#praiseText').value.trim();if(str.length<5)return toast('칭찬을 5글자 이상 입력해 줘!');let first=state.praise.length===0;state.praise.push({from:state.chosen,to:Number(el.querySelector('#praiseTo').value),text:str,day:formatDay()});if(first)addXP(50);save();openPanel('praise');toast('💗 칭찬 메시지가 저장됐어!')});return}
if(id==='class'||id==='hall'){let members=Array.from({length:28},(_,i)=>`<button class="primary secondary" data-student="${i+1}" style="padding:6px 8px;flex:1;min-width:64px">${i+1}번</button>`).join('');openModal('🧑‍🤝‍🧑 28명 학급 활동',`<p class="desc">학생별 이름 대신 번호만 표시하는 체험판이야. 다른 학생의 개인 공부 기록은 공개하지 않아.</p><div class="row">${members}</div><p class="footnote">학생 번호를 누르면 체험할 캐릭터를 선택할 수 있어. 실제 서비스에는 본인 계정 인증이 필요해.</p>`,el=>el.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{state.chosen=Number(b.dataset.student);save();closeModal();toast(`${state.chosen}번 캐릭터를 체험 중이야!`);updatePlayerFromNpc()}));return}
if(id==='settings'){openModal('⚙️ 체험판 설정',`<p class="desc">현재 체험판은 로그인과 Firebase 연결이 없으며, 데이터는 이 브라우저의 로컬 저장소에만 보관돼.</p><div class="choice">현재 캐릭터 <b>${state.chosen}번</b></div><button class="primary wide" id="resetState">↺ 체험 기록 초기화</button><p class="footnote">초기화를 누르면 로컬 경험치·미션·공부 기록·칭찬 메시지가 사라져.</p>`,el=>el.querySelector('#resetState').onclick=()=>{if(!confirm('체험 기록을 모두 지울까?'))return;state=fresh();save();updateUI();closeModal();toast('체험 기록을 초기화했어!')});return}

function escapeText(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updatePlayerFromNpc(){if(state.chosen===1){player.x=740;player.y=570}else{let npc=npcs.find(n=>n.id===state.chosen);if(npc){player.x=npc.x;player.y=npc.y}}updateUI()}
function openPlace(p){openPanel(({library:'study',hall:'class',lab:'missions',shop:'shop',board:'missions'})[p.id]||'village')}
function resize(){view.dpr=Math.min(devicePixelRatio||1,2);view.w=innerWidth;view.h=innerHeight;canvas.width=Math.round(view.w*view.dpr);canvas.height=Math.round(view.h*view.dpr);g.setTransform(view.dpr,0,0,view.dpr,0,0);view.scale=view.h>view.w*1.25?Math.min(1.35,view.h/world.h):Math.max(.55,Math.min(1.22,Math.min(view.w/1080,view.h/690)));g.imageSmoothingEnabled=true;}
window.addEventListener('resize',resize,{passive:true});resize();
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function isWalkable(x,y){if(x<45||x>1455||y<258||y>786)return false;if(x>1150&&y>465&&y<735)return false;if(x<300&&y<390)return false;if(x>1000&&y<360)return false;if(x>580&&x<960&&y<315)return false;return true}
function mapPoint(clientX,clientY){return{x:(clientX/view.scale+view.camX),y:(clientY/view.scale+view.camY)}}
function chooseNPC(x,y){let nearest=null,dist=40;for(const n of npcs){let d=Math.hypot(n.x-x,n.y-y);if(d<dist){nearest=n;dist=d}}return nearest}
function canvasClick(e){const {x,y}=mapPoint(e.clientX,e.clientY);let p=places.find(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);if(p){openPlace(p);return}let n=chooseNPC(x,y);if(n){if(n.id===state.chosen)return openPanel('growth');openModal(`🌸 ${n.id}번 주민`, `<p class="desc">${n.id}번 주민은 현재 <b>${phaseFor(n.lv).label}</b> 모습으로 마을을 산책하는 가상 캐릭터야.</p><div class="choice">🌱 성장 단계 <b>Lv.${n.lv}</b></div><button class="primary wide" id="selectResident">이 주민으로 체험하기</button>`,el=>el.querySelector('#selectResident').onclick=()=>{state.chosen=n.id;save();updatePlayerFromNpc();closeModal();toast(`${n.id}번 주민으로 변경했어!`)});return}}
let pointerDown=null;
canvas.addEventListener('pointerdown',e=>{pointerDown={x:e.clientX,y:e.clientY,t:performance.now()}});
canvas.addEventListener('pointerup',e=>{if(!pointerDown)return;let d=Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y);if(d<9)canvasClick(e);pointerDown=null});
$('closeModal').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));
$('growTop').onclick=()=>openPanel('growth');$('helpTop').onclick=()=>openPanel('help');$('helpButton').onclick=()=>openPanel('help');
$('fullTop').onclick=()=>{if(!document.fullscreenElement){$('shell').requestFullscreen?.().catch(()=>toast('전체 화면을 사용할 수 없는 환경이야'))}else document.exitFullscreen?.()};
const keyMap={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
addEventListener('keydown',e=>{if(e.key==='Escape')return closeModal();if(document.activeElement?.matches('input,textarea,select'))return;let k=keyMap[e.key.toLowerCase()];if(k){keys.add(k);e.preventDefault()}if(e.code==='Space'&&nearby){e.preventDefault();openPlace(nearby)}});
addEventListener('keyup',e=>{let k=keyMap[e.key.toLowerCase()];if(k)keys.delete(k)});addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
let sparkle=0;
function drawText(text,x,y,size=13,col='#fff',stroke='#59405d'){g.font=`900 ${size}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=3.2;g.strokeStyle=stroke;g.strokeText(text,x,y);g.fillStyle=col;g.fillText(text,x,y)}

const styles=[{hair:'#39263a',trim:'#ed7da4'},{hair:'#654132',trim:'#60b8e8'},{hair:'#2e3548',trim:'#82b85a'},{hair:'#503443',trim:'#a88cea'},{hair:'#81533c',trim:'#efab49'},{hair:'#332c47',trim:'#d179be'}];
function drawPerson(n,isPlayer,time){let phase=phaseFor(isPlayer?state.lv:n.lv),style=styles[isPlayer?state.avatar:n.style];let x=n.x,y=n.y,s=(isPlayer?1.02:.87),bob=Math.sin(time*5.5+n.step)*1.4,dir=n.dir||1;
 let sprite=portraitSprites[phases.indexOf(phase)];
 if(sprite.complete && sprite.naturalWidth){
  g.save();g.translate(x,y+bob);g.scale(s,s);
  g.fillStyle='#29233a77';g.beginPath();g.ellipse(0,1,21,6,0,0,Math.PI*2);g.fill();
  if(isPlayer){g.strokeStyle='#fff3a8';g.lineWidth=3;g.beginPath();g.ellipse(0,1,26,9,0,0,Math.PI*2);g.stroke()}
  // A small sway and mirror provide movement until true directional sprites are developed.
  if(dir<0)g.scale(-1,1);
  g.drawImage(sprite,-43,-82,86,86);
  if((isPlayer?state.avatar:n.style)%3===1){g.fillStyle='#ffffffcc';g.beginPath();g.arc(17,-51,3,0,Math.PI*2);g.fill()}
  g.restore();
  if(showNumbers){rr(x-(isPlayer?25:20),y+7,isPlayer?50:40,17,7,isPlayer?'#9e5c83eF':'#302544dE');drawText(isPlayer?`${state.chosen}번 · 나`:`${n.id}번`,x,y+16,10,'#fff8e9','#382c43')}
  if(isPlayer){drawText('◆',x,y-90,15,'#ffe16d','#553e75');if(sparkle>0){for(let i=0;i<8;i++){let a=i*Math.PI/4+time,r=37+Math.sin(time*6+i)*6;drawText('✦',x+Math.cos(a)*r,y-45+Math.sin(a)*r,13,'#fff2a4','#775da3')}}}
  return;
 }

 g.save();g.translate(x,y+bob);g.scale(s,s);
 // soft ground shadow + circular player identification ring
 g.fillStyle='#28244466';g.beginPath();g.ellipse(0,0,16,5,0,0,Math.PI*2);g.fill();if(isPlayer){g.strokeStyle='#fff0a8';g.lineWidth=3;g.beginPath();g.ellipse(0,0,22,8,0,0,Math.PI*2);g.stroke()}
 if(phase.lv===1){ // baby: plump onesie and cap, short legs
  rr(-10,-16,9,10,3,'#8c6d96');rr(2,-16,9,10,3,'#8c6d96');rr(-16,-33,32,22,11,'#f5b6d6');rr(-13,-51,26,24,11,'#ffdbbd');rr(-15,-58,30,15,9,style.hair);circle(-5,-40,1.7,'#362b47');circle(5,-40,1.7,'#362b47');rr(-2,-36,5,2,2,'#d87888');circle(0,-54,4,'#ffe5ef');
 }else{
  // animated legs
  let stride=Math.sin(time*7+n.step)*3;rr(-11,-15,8,15+stride,3,phase.lv>=20?'#3b3558':'#665480');rr(3,-15,8,15-stride,3,phase.lv>=20?'#3b3558':'#665480');rr(-13,-3+stride,11,5,2,'#41344f');rr(2,-3-stride,11,5,2,'#41344f');
  // backpack shoulder for school ages
  if(phase.lv>=10){rr(dir===1?-17:7,-35,11,24,5,phase.lv>=35?'#af80b5':'#e4a669')}
  rr(-13,-37,26,25,7,phase.color);rr(-16,-33,5,17,3,'#ffcfab');rr(11,-33,5,17,3,'#ffcfab');
  if(phase.lv>=20){rr(-10,-36,20,5,3,'#f5e9dc');g.fillStyle='#b94369';g.beginPath();g.moveTo(0,-30);g.lineTo(-4,-21);g.lineTo(4,-21);g.closePath();g.fill()}
  if(phase.lv===5){rr(-10,-35,20,5,4,style.trim)}
  if(phase.lv===10){rr(-12,-39,24,5,3,'#fee6a4')}
  if(phase.lv>=50){rr(-11,-37,22,6,4,'#fff4df');rr(6,-28,3,13,2,style.trim)}
  // face and hair, body proportions differ
  let faceY=phase.lv>=20?-57:-55;rr(-14,faceY,28,25,10,'#ffe0bc');rr(-16,faceY-6,32,12,7,style.hair);rr(-17,faceY,7,17,4,style.hair);rr(10,faceY,7,16,4,style.hair);
  // hairstyle variety
  if(n.style%3===0||isPlayer&&state.avatar%3===0){circle(-16,faceY+8,6,style.hair);circle(16,faceY+8,6,style.hair)}
  if(phase.lv>=10){rr(-16,faceY-11,32,8,4,phase.lv>=35?'#9b75be':'#f5c86e');rr(4,faceY-8,15,4,2,'#f4e8b6')}
  circle(-6,faceY+12,2.2,'#332844');circle(7,faceY+12,2.2,'#332844');circle(-10,faceY+16,2.8,'#f4afb0');circle(11,faceY+16,2.8,'#f4afb0');rr(-2,faceY+18,5,2,2,'#b96e82');
  if(phase.lv===50){circle(0,faceY-12,4,'#ffdb76')}
 }
 g.restore();
 if(showNumbers){rr(x-(isPlayer?25:20),y+7,isPlayer?50:40,17,7,isPlayer?'#9e5c83eF':'#302544dE');drawText(isPlayer?`${state.chosen}번 · 나`:`${n.id}번`,x,y+16,isPlayer?10:10,'#fff8e9','#382c43')}
 if(isPlayer){drawText('◆',x,y-(phase.lv===1?62:77)*s,14,'#ffe16d','#553e75');if(sparkle>0){for(let i=0;i<8;i++){let a=i*Math.PI/4+time;let r=35+Math.sin(time*6+i)*6;drawText('✦',x+Math.cos(a)*r,y-38+Math.sin(a)*r,13,'#fff2a4','#775da3')}}}
}
function drawScene(t,dt){let w=view.w,h=view.h,sc=view.scale;
 let px=player.x,py=player.y;
 view.camX=clamp(px-w/(sc*2),0,Math.max(0,world.w-w/sc));view.camY=clamp(py-h/(sc*2),0,Math.max(0,world.h-h/sc));
 if(world.w<w/sc)view.camX=(world.w-w/sc)/2;if(world.h<h/sc)view.camY=(world.h-h/sc)/2;
 g.setTransform(view.dpr,0,0,view.dpr,0,0);g.clearRect(0,0,w,h);g.fillStyle='#568f87';g.fillRect(0,0,w,h);
 g.save();g.scale(sc,sc);g.translate(-view.camX,-view.camY);
 if(mapImg.complete&&mapImg.naturalWidth)g.drawImage(mapImg,0,0,world.w,world.h);else{g.fillStyle='#9ccf94';g.fillRect(0,0,world.w,world.h)}
 // Animated light and subtle sparkle on the town, not a static mockup
 for(let i=0;i<27;i++){let x=70+(i*157)%1380,y=280+(i*111)%480;let a=Math.sin(t/850+i*1.5)*.3+.5;g.globalAlpha=a;circle(x,y,1.8+(i%3),i%2?'#fff9b2':'#ffe2ec')}g.globalAlpha=1;
 let actors=npcs.filter(n=>n.id!==state.chosen).map(n=>({p:n,player:false}));actors.push({p:{...player,step:player.step,lv:state.lv,style:state.avatar,id:state.chosen},player:true});actors.sort((a,b)=>a.p.y-b.p.y);for(let a of actors)drawPerson(a.p,a.player,t/1000);
 if(nearby){let cx=player.x,cy=player.y-100;rr(cx-100,cy-14,200,29,10,'#332343dc');drawText(`스페이스: ${nearby.name}`,cx,cy,12,'#ffe8a5')}
 g.restore();}
function tick(t){let dt=Math.min((t-last)/1000||.016,.05);last=t;frame++;
 if(!$('overlay').classList.contains('open')){
  let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));
  if(dx||dy){let d=Math.hypot(dx,dy),nx=player.x+dx/d*155*dt,ny=player.y+dy/d*155*dt;if(isWalkable(nx,ny)){player.x=nx;player.y=ny}player.dir=dx===0?player.dir:Math.sign(dx);player.step+=dt*8;}
  for(let n of npcs){n.delay-=dt;if(n.delay<=0){let found=false;for(let j=0;j<15;j++){let tx=clamp(n.x+(Math.random()-.5)*180,50,1450),ty=clamp(n.y+(Math.random()-.5)*130,270,770);if(isWalkable(tx,ty)){n.tx=tx;n.ty=ty;found=true;break}}n.delay=found?2+Math.random()*4:.8;}
   let vx=n.tx-n.x,vy=n.ty-n.y,len=Math.hypot(vx,vy);if(len>4){n.x+=vx/len*27*dt;n.y+=vy/len*27*dt;n.dir=Math.sign(vx)||n.dir;n.step+=dt*7;}
  }
 }
 nearby=places.find(p=>Math.hypot(player.x-(p.x+p.w/2),player.y-(p.y+p.h))<160)||null;
 if(sparkle>0)sparkle=Math.max(0,sparkle-dt);
 drawScene(t,dt);requestAnimationFrame(tick)}
// When changing chosen number, its prior NPC position becomes playable.
updatePlayerFromNpc();updateUI();requestAnimationFrame(tick);
